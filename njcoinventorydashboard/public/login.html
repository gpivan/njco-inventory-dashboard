<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
    <title>Sign in — NJ&amp;CO Inventory</title>
    <style>
      :root {
        --terracotta: #c77b5a;
        --terracotta-dark: #b5654a;
        --blush: #f1dcd4;
        --blush-soft: #fbeee9;
        --beige: #f7f1ea;
        --bg: #fcfaf7;
        --card: #ffffff;
        --border: #ece5dd;
        --ink: #2e2a28;
        --ink-2: #5c534d;
        --muted: #938980;
        --red-bg: #f6e0dc;
        --red-ink: #9a4339;
        --serif: 'Cormorant Garamond', Georgia, serif;
        --sans: 'DM Sans', -apple-system, system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: var(--sans);
        color: var(--ink);
        background: radial-gradient(circle at 15% 10%, var(--blush-soft), transparent 55%),
          radial-gradient(circle at 85% 90%, var(--beige), transparent 55%), var(--bg);
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 40px 32px 32px;
        text-align: center;
        box-shadow: 0 8px 30px rgba(60, 40, 30, 0.1), 0 30px 60px rgba(60, 40, 30, 0.08);
      }
      .logo {
        width: 180px;
        max-width: 60%;
        height: auto;
        margin: 0 auto 4px;
        display: block;
      }
      h1 {
        font-family: var(--serif);
        font-size: 22px;
        font-weight: 600;
        margin: 18px 0 4px;
      }
      p.sub {
        font-size: 13.5px;
        color: var(--muted);
        margin: 0 0 28px;
        line-height: 1.5;
      }
      .g-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        height: 48px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #fff;
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14.5px;
        font-weight: 600;
        text-decoration: none;
        transition:
          background 0.15s,
          box-shadow 0.15s,
          transform 0.05s;
      }
      .g-btn:hover {
        background: var(--beige);
      }
      .g-btn:active {
        transform: scale(0.99);
      }
      .g-btn svg {
        width: 19px;
        height: 19px;
        flex: none;
      }
      .error {
        display: none;
        margin-top: 20px;
        padding: 11px 14px;
        border-radius: 10px;
        background: var(--red-bg);
        color: var(--red-ink);
        font-size: 12.5px;
        line-height: 1.5;
        text-align: left;
      }
      .error.show {
        display: block;
      }
      .foot {
        margin-top: 26px;
        font-size: 11.5px;
        color: var(--muted);
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/njco-logo.png" alt="NJ&amp;CO" />
      <h1>Boutique Admin</h1>
      <p class="sub">Sign in with an authorized Google account to open the inventory dashboard.</p>
      <a class="g-btn" id="google-btn" href="/api/auth/login">
        <svg viewBox="0 0 48 48">
          <path
            fill="#FFC107"
            d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"
          />
          <path
            fill="#FF3D00"
            d="m6.3 14.7 6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6 29.6 4 24 4c-7.4 0-13.8 4.1-17.1 10.1"
          />
          <path
            fill="#4CAF50"
            d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.6C29.6 35.5 26.9 36.5 24 36.5c-5.2 0-9.6-3.3-11.3-7.9l-6.6 5.1C9.2 39.8 16 44 24 44z"
          />
          <path
            fill="#1976D2"
            d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.6C41.3 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"
          />
        </svg>
        Continue with Google
      </a>
      <div class="error" id="error-box"></div>
      <div class="foot">NJ&amp;CO · Access restricted to approved accounts</div>
    </div>
    <script>
      // login.js redirects here with ?denied=1 when the signed-in Google account isn't
      // on the allow list, so the reason shows without another round trip to Google.
      const params = new URLSearchParams(location.search);
      if (params.get('denied')) {
        const box = document.getElementById('error-box');
        box.textContent = 'That Google account isn’t allowed to access this app. Try a different account.';
        box.classList.add('show');
      }
      if (params.get('error')) {
        const box = document.getElementById('error-box');
        box.textContent = 'Sign-in failed. Please try again.';
        box.classList.add('show');
      }
    </script>
  </body>
</html>
